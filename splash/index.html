<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Winvestour</title>
<script>
/* Marka, pencere URL'indeki ?app=<key> ile secilir (tauri.conf.json /
   configs/*.conf.json -> app.windows[].url). Arka plan ilk boyamadan ONCE
   burada set ediliyor ki beyaz flas olmasin. */
(function () {
  var BRAND = {
    social:     { c: '#7C3AED', n: 'Wocial' },
    commerce:   { c: '#0072CE', n: 'Wommerce' },
    influencer: { c: '#E11D48', n: 'Winfluencers' },
    reseller:   { c: '#059669', n: 'Wellers' },
    staff:      { c: '#0B1F3A', n: 'Winvestour Staff' },
    /* 6 Agu — CATI UYGULAMASI: tek urun degil, sistemin tamami. */
    hub:        { c: '#00468C', n: 'Winvestour' }
  };
  var key = (location.search.match(/[?&]app=([a-z]+)/) || [])[1] || 'social';
  var b = BRAND[key] || BRAND.social;
  window.__WV_SPLASH__ = { key: key, name: b.n };
  document.documentElement.style.background = b.c;
})();
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: inherit; user-select: none; -webkit-user-select: none;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  /* Logo PNG'lerinin arka plani zaten marka rengiyle ayni — sayfaya kusursuz
     karisiyor, ayrica border-radius/golgeye gerek yok. */
  img { width: 96px; height: 96px; display: block; }
  .name { color: #fff; font-size: 15px; font-weight: 600; opacity: .92; letter-spacing: .2px; }
  .dots { display: flex; gap: 6px; }
  .dots span {
    width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: .5;
    animation: pulse 1.1s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: .15s; }
  .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: .35; transform: scale(.7); }
    40%           { opacity: 1;   transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .dots span { animation: none; opacity: .6; } }
</style>
</head>
<body>
  <img id="logo" alt="" />
  <div class="name" id="name"></div>
  <div class="dots"><span></span><span></span><span></span></div>
<script>
  document.getElementById('logo').src = 'logo-' + window.__WV_SPLASH__.key + '.png';
  document.getElementById('name').textContent = window.__WV_SPLASH__.name;
</script>
</body>
</html>
